        content:
          application/json:
            schema:
              type: object
              properties:
                inputs:
                  type: object
                  required:
                  - inputType
                  properties:
                    inputType:
                      type: string
                      description: User input type
                    group:
                      type: integer
                      description: Index of verificationSteps with given inputType in merchant configurations. Each document
                        must have a unique group number, starting from 0. MetaMap-supported documents must precede custom
                        documents.
                      format: int32
                    data:
                      type: object
                      required:
                      - filename
                      properties:
                        type:
                          type: string
                          description: For a MetaMap-supported document, the type of document, (driving-license, national-id,
                            passport, proof-of-residency). For a selfie, selfie-photo. For a liveness video, selfie-video
                            For a custom document, use the webhook label name you defined when you added the Custom Document
                            merit to your metamap
                        country:
                          type: string
                          description: Country code. Used only for MetaMap-supported documents to specify the document's country
                            of issue. Omit this parameter for custom documents. Uses ISO 2 codes.
                        region:
                          type: string
                          description: Used only to verify users in the United States. For non-US users, leave blank (example,
                            ""). Refers to the user's state of residency (for example, "AL" for "Alabama"). Uses the US Postal
                            Service state abbreviations
                        page:
                          type: string
                          description: The document's page side.  1-sided documents require only the front 2-sided documents
                            can be uploaded as two separate files (front and back) 2-sided Custom documents can be uploaded
                            as 2 separate image files (front and back) or as a single *.pdf file (multi) Custom documents
                            with >2 sides must upload a single *.pdf file (multi)
                        filename:
                          type: string
                          description: The name of the file being uploaded.
                document:
                  type: string
                  description: MetaMap-supported documents only. Location of file to upload.
                  format: binary
                custom-document:
                  type: string
                  description: Custom documents only. Location of file to upload.
                  format: binary
      responses:
