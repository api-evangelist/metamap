  /safety/v1/checks/phone/otp:
    post:
      summary: Phone Ownership
      description: This API sends an OTP through SMS to verify ownership
      operationId: phone-ownership
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - callbackUrl
              - locale
              - recipient
              - senderName
              properties:
                callbackUrl:
                  type: string
                  description: Callback URL to receive webhooks.
                locale:
                  type: string
                  description: 'Location of search. Currently allows one of the following values: `"en_US"`, `"es_MX"`, `""`,
                    and `null`.'
                recipient:
                  type: string
                  description: Country code and phone number. Must be entered as a single number with no delimiters, such
                    as "-" or "." or spaces.
                senderName:
                  type: string
                  description: User name associated with the SMS number.
                metadata:
                  type: string
                  description: Metadata to be sent to a webhook (`callbackUrl`)
                  default: '{ "user-defined-1" : "abcde", "user-defined-2" : "12345" }'
                  format: json
      responses:
        '200':
          description: '200'
          content:
            text/plain:
              examples:
                Result:
                  value: "{\n  \"error\": null,\n  \"data\": {\n    \"confirmationCode\": \"8844\"\n  },\n  \"metadata\":\
                    \ {\n  \t\"user_defined\": \"id00000\"\n  }\n}"
              schema:
                type: object
                properties:
                  error: {}
                  data:
                    type: object
                    properties:
                      confirmationCode:
                        type: string
                        example: '8844'
                  metadata:
                    type: object
                    properties:
                      user_defined:
                        type: string
                        example: id00000
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      x-readme:
