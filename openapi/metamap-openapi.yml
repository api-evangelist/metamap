  /safety/v1/checks/comply-advantage:
    post:
      summary: Comply Advantage
      description: Use this check to verify whether a user or company is listed on international watchlists.
      operationId: comply-advantage
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              properties:
                entityType:
                  type: string
                  description: Choose between `person` or `company`.
                  default: person
                name:
                  type: string
                  description: User's full name or company's name
                birthYear:
                  type: integer
                  description: Applicable to 'person', only. User's year of birth.
                  format: int32
                monitor:
                  type: boolean
                  description: Set to true if you want the search to be monitored regularly.
                  default: false
                callbackUrl:
                  type: string
                  description: Callback URL for monitoring updates through webhooks. Mandatory if monitor = true.
                countryCodes:
                  type: array
                  description: An array of 2-letter country codes as per [ISO 3166-1 alpha-2](https://en.wikipedia.org/wiki/ISO_3166-1_alpha-2).
                  items:
                    type: string
                exactMatch:
                  type: boolean
                  description: Specify that results must match all specified parameters.
                  default: false
                fuzzinessThreshold:
                  type: integer
                  description: Integer in range of 0-100 specifying how closely matched results must be to the specified parameters.
                  default: 50
                  format: int32
                metadata:
                  type: string
                  description: Use the `metadata` parameter to add internal references.
                  default: '{ "user-defined-1" : "abcde", "user-defined-2" : "12345" }'
                  format: json
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Person Not Found:
                  value: "{\n  \"data\": {\n    \"searchedOn\": \"2020-05-13 09:26:50\",\n    \"nameSearched\": \"JOHN DOE\"\
                    ,\n    \"profileUrl\": \"https://public.url\",\n    \"error\": null\n  }\n}"
