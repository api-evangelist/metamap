                    inputs\": [\n    {\n      \"id\": \"connection-data\",\n      \"status\": 200,\n      \"optional\": false\n\
                    \    },\n    {\n      \"id\": \"selfie-photo\",\n      \"status\": 0\n    }\n  ],\n  \"metadata\": {\n\
