                  value: "{\n    \"searchedOn\": \"2022-03-01 00:00:00\",\n    \"nameSearched\": \"JOHN DOE\",\n    \"profileUrl\"\
                    : \"https://app.complyadvantage.com/public/search/1234567890-abcdef1g/123456789012\",\n    \"searchId\"\
                    : 000000000,\n    \"error\": {\n        \"type\": \"SafetyCheckError\",\n        \"code\": \"premiumAmlWatchlists.matchFound\"\
                    ,\n        \"details\": {\n            \"matchStatus\": \"potential_match\",\n            \"riskLevel\"\
                    : \"unknown\"\n        }\n    }"
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      searchedOn:
                        type: string
                        example: '2020-05-13 09:26:50'
                      nameSearched:
                        type: string
                        example: JOHN DOE
