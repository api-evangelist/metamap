openapi: 3.1.0
info:
  title: MetaMap Authentication Background Checks API
  version: '1.4'
  description: MetaMap (formerly Mati) identity verification REST API. Start and manage user verifications, retrieve verification media, run watchlist, email, phone, credit, court-record, and government database checks across Latin America, Africa, and Asia.
  contact:
    name: MetaMap
    url: https://metamap.com
  license:
    name: MetaMap Terms of Service
    url: https://metamap.com/legal/terms-of-service
servers:
- url: https://api.prod.metamap.com
  description: Production
security:
- bearerAuth: []
tags:
- name: Background Checks
paths:
  /backgroundchecks/v1/br/background:
    post:
      summary: 'Brazil: Court Records'
      description: Use this API to check for users for court records in Brazil
      operationId: brazil-court-records
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - fullName
              - cpf
              - callbackUrl
              - dateOfBirth
              - fullCheck
              properties:
                fullName:
                  type: string
                  description: User's full name
                cpf:
                  type: string
                  description: User's Registration of Individuals (Cadastro de Pessoas Físicas / CPF) number
                callbackUrl:
                  type: string
                  description: Callback URL to receive data.
                dateOfBirth:
                  type: string
                  format: date
                fullCheck:
                  type: boolean
                  description: Use `true` for the full background check.
