position: Consuming
description: MetaMap (formerly Mati) is an identity verification platform founded in 2017 in San Francisco
  and headquartered there, serving 600+ companies across 50+ countries with a focus on Latin America, Africa,
  and other emerging markets. The platform combines document verification, biometric liveness, facematch,
  watchlist screening, behavioral risk signals, and 40+ government-database "GovChecks" to power KYC, AML
  compliance, customer onboarding, authentication, and financial risk management workflows for banks,
  fintechs, lenders, telcos, and transportation providers. Developers integrate via a REST API on
  api.prod.metamap.com, configurable workflows ("metamaps"), webhooks, and native SDKs for Web, iOS, Android,
  Flutter, React Native, Cordova, and Capacitor. MetaMap joined Incode in 2024 to expand identity-verification
  coverage globally.
